org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Path to the shared ZPlanKit checkout that holds the C engine (Sources/CZPlan).
# Relative paths are resolved against the app module directory.
#
# F-Droid does NOT use this line. Their builders check out only this repository
# and fetch the engine as the `engine` submodule, overriding the property with
# -Pzplankit.dir=engine. A path pointing off into DeveloperApple would fail on
# any machine but the author's, which is precisely the class of thing F-Droid's
# build servers exist to catch. See FDROID.md.
#
# Keep this path free of spaces: the NDK's CMake/ninja toolchain breaks on them.
zplankit.dir=../../../DeveloperApple/ZPlanKit
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
