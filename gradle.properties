org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Path to the shared ZPlanKit checkout that holds the C engine (Sources/CZPlan).
# Relative paths are resolved against the REPOSITORY ROOT, not the app module.
#
# Left unset, the build uses the `engine` submodule at the root of this
# repository — which is what F-Droid's builders check out, and what you get
# from a plain `git clone --recurse-submodules`. That is the default on
# purpose: the build should work for anyone who clones it, not only here.
#
# Uncomment the line below only to build against a working ZPlanKit checkout
# you are actively editing, and remember the submodule is what ships.
#
# Keep any path free of spaces: the NDK's CMake/ninja toolchain breaks on them.
#
#zplankit.dir=../../DeveloperApple/ZPlanKit
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
